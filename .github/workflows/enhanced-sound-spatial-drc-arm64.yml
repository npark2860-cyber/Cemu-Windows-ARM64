name: Enhanced Sound Spatial DRC ARM64

on:
  push:
    branches:
      - feat/enhanced-sound-experience-v1
    paths:
      - 'tools/add_enhanced_sound_spatial_drc.py'
      - '.github/workflows/enhanced-sound-spatial-drc-arm64.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enhanced-sound-spatial-drc-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Guard branch
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'feat/enhanced-sound-experience-v1') {
            throw 'Spatial DRC workflow may run only on feat/enhanced-sound-experience-v1'
          }
          Write-Host "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Apply spatial DRC mode
        shell: pwsh
        run: python tools/add_enhanced_sound_spatial_drc.py

      - name: Validate spatial routing structure
        shell: pwsh
        run: |
          git diff --check -- `
            src/Cafe/OS/common/EnhancedSoundRouter.h `
            src/Cafe/GraphicPack/GraphicPack2.cpp `
            src/Cafe/OS/libs/snd_core/ax_voice.cpp

          $router = Get-Content 'src/Cafe/OS/common/EnhancedSoundRouter.h' -Raw
          $gp = Get-Content 'src/Cafe/GraphicPack/GraphicPack2.cpp' -Raw
          $ax = Get-Content 'src/Cafe/OS/libs/snd_core/ax_voice.cpp' -Raw
          $routes = Get-Content 'enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini' -Raw
          $ds = Get-Content 'src/Cafe/OS/common/EnhancedSoundDualSenseService.h' -Raw

          if ($router -notmatch 'SpatialDRC\s*=\s*2') { throw 'SpatialDRC router mode missing' }
          if ($gp -notmatch 'spatial_drc') { throw 'spatial_drc Graphic Pack parser missing' }
          if ($ax -notmatch 'EnhancedSoundRouter::Mode routeMode') { throw 'per-voice route mode persistence missing' }
          if ($ax -notmatch 'AXApplyEnhancedSoundDrcPolicy') { throw 'shared DRC policy helper missing' }
          if ($ax -notmatch 'routeMode == EnhancedSoundRouter::Mode::SpatialDRC') { throw 'persistent spatial TV refresh path missing' }
          if ($ax -notmatch 'static_cast<uint64_t>\(routeGain\) \* tvVolume') { throw 'native TV spatial envelope scaling missing' }
          if ($ax -notmatch 'scaledDelta') { throw 'native TV delta scaling missing' }
          if ($ax -notmatch 'AXApplyEnhancedSoundTvPolicy\(enhancedTvMix, route->mode\)') { throw 'mode-aware TV policy missing' }
          if ($routes -notmatch 'mode\s*=\s*add_drc') { throw 'existing add_drc BOTW policy missing' }
          if ($routes -notmatch 'SE_NSword_SwingMiddleEnemy') { throw 'confirmed one-hand fourth-hit route missing' }
          $dsCode = ($ds -replace '(?m)//.*$', '') -replace '\s+', ''
          if ($dsCode -notmatch 'DualSenseSettings\(0,0,1,0,255,255,0,0\);') { throw 'DualSense internal speaker volume must remain 255' }

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure native ARM64 Cemu
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER_TYPE=MSVC `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        shell: pwsh
        run: cmake --build build --target CemuBin --parallel

      - name: Verify native ARM64 executable
        shell: pwsh
        run: |
          $exe = 'bin/Cemu_release.exe'
          if (-not (Test-Path $exe)) { throw 'Cemu_release.exe not found' }
          $headers = (& dumpbin /headers $exe | Out-String)
          if ($headers -notmatch 'AA64|ARM64') { throw 'Executable is not ARM64' }

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add `
            src/Cafe/OS/common/EnhancedSoundRouter.h `
            src/Cafe/GraphicPack/GraphicPack2.cpp `
            src/Cafe/OS/libs/snd_core/ax_voice.cpp
          if (-not (git diff --cached --quiet)) {
            git commit -m 'audio: add spatial DRC routing mode'
            git fetch origin feat/enhanced-sound-experience-v1
            git rebase origin/feat/enhanced-sound-experience-v1
            git push origin HEAD:feat/enhanced-sound-experience-v1
          }
          "IMPLEMENTATION_HEAD=$(git rev-parse HEAD)" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu-EnhancedSound-SpatialDRC-ARM64.exe
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/rules.txt artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/rules.txt
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini
          @"
          Enhanced Sound Spatial DRC — Windows ARM64
          implementation_head=$Env:IMPLEMENTATION_HEAD
          - add_drc: existing fixed controller send; matched TV remains 50 percent
          - spatial_drc: controller send follows native TV front L/R volume and delta
          - spatial_drc leaves native TV mix unchanged
          - spatial_drc maximum send is capped by the route gain (TV 0x8000 = 1.0)
          - no BOTW bomb-explosion track is hardcoded; policy mapping waits for confirmed trace evidence
          "@ | Set-Content artifact/SPATIAL-DRC.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-EnhancedSound-SpatialDRC-ARM64
          path: artifact/**
          if-no-files-found: error

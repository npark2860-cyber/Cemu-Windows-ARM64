name: DualSense Gamepad-Core ARM64 smoke

on:
  push:
    branches:
      - exp/dualsense-gamepad-core-arm64
    paths:
      - 'dependencies/Gamepad-Core/**'
      - 'tools/dualsense_haptic_lab/**'
      - '.gitmodules'
      - '.github/workflows/dualsense-gamepad-core-arm64.yml'
  workflow_dispatch:

concurrency:
  group: dualsense-gamepad-core-arm64
  cancel-in-progress: true

jobs:
  build-gamepad-core-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo only
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Checkout Gamepad-Core only
        shell: pwsh
        run: |
          git submodule sync -- dependencies/Gamepad-Core
          git submodule update --init --depth=1 dependencies/Gamepad-Core
          git -C dependencies/Gamepad-Core submodule sync --recursive
          git -C dependencies/Gamepad-Core submodule update --init --recursive --depth=1

      - name: Verify pinned Gamepad-Core revision
        shell: pwsh
        run: |
          $actual = git -C dependencies/Gamepad-Core rev-parse HEAD
          $expected = '9a16b81604fd711db3c445e8a8108e2b570f6477'
          Write-Host "Gamepad-Core HEAD: $actual"
          if ($actual -ne $expected) { throw "Unexpected Gamepad-Core revision: $actual" }

      - name: Setup MSVC ARM64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Setup Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Configure native ARM64 standalone build
        shell: pwsh
        run: |
          cmake -S dependencies/Gamepad-Core -B build/gamepad-core-arm64 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF

      - name: Build GamepadCore
        shell: pwsh
        run: cmake --build build/gamepad-core-arm64 --target GamepadCore --parallel

      - name: Verify ARM64 library output exists
        shell: pwsh
        run: |
          $libs = Get-ChildItem build/gamepad-core-arm64 -Recurse -File | Where-Object { $_.Name -match 'GamepadCore.*\.(lib|a)$' }
          if (-not $libs) { throw 'GamepadCore library output not found' }
          $libs | ForEach-Object { Write-Host $_.FullName }

      - name: Configure Haptic Lab GUI
        shell: pwsh
        run: |
          cmake -S tools/dualsense_haptic_lab -B build/dualsense-haptic-lab -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Haptic Lab GUI
        shell: pwsh
        run: cmake --build build/dualsense-haptic-lab --target CemuDualSenseHapticLab --parallel

      - name: Verify native ARM64 GUI executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/dualsense-haptic-lab -Recurse -Filter CemuDualSenseHapticLab.exe | Select-Object -First 1
          if (-not $exe) { throw 'CemuDualSenseHapticLab.exe not found' }
          Write-Host "GUI EXE: $($exe.FullName)"
          $headers = (& dumpbin /headers $exe.FullName | Out-String)
          Write-Host $headers
          if ($headers -notmatch 'AA64|ARM64') { throw 'GUI executable is not ARM64' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName artifact/CemuDualSenseHapticLab.exe

      - name: Upload Haptic Lab ARM64 GUI
        uses: actions/upload-artifact@v4
        with:
          name: CemuDualSenseHapticLab-ARM64
          path: artifact/CemuDualSenseHapticLab.exe
          if-no-files-found: error

name: Cemu ARM64 runtime experiments

on:
  push:
    branches:
      - runtime-experiments-arm64
  workflow_dispatch:

concurrency:
  group: runtime-experiments-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply known-good pre-e834 runtime behavior
        shell: pwsh
        run: |
          $swap = 'src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp'
          $s = Get-Content $swap -Raw
          $oldLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_DONT_CARE;'
          $newLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_LOAD;'
          if (-not $s.Contains($oldLoad)) { throw 'Swapchain loadOp pattern not found' }
          $s = $s.Replace($oldLoad, $newLoad)
          Set-Content -Path $swap -Value $s -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw

          $oldFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;'
          $newFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_SIMULTANEOUS_USE_BIT;'
          $flagCount = ([regex]::Matches($v, [regex]::Escape($oldFlag))).Count
          if ($flagCount -ne 2) { throw "Expected 2 ONE_TIME_SUBMIT flags, found $flagCount" }
          $v = $v.Replace($oldFlag, $newFlag)

          $anchorLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`n`tdraw_endRenderPass();`n"
          $anchorCRLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`r`n`tdraw_endRenderPass();`r`n"
          if ($v.Contains($anchorCRLF)) {
            $v = $v.Replace($anchorCRLF, $anchorCRLF + "`r`n`tif (clearBackground)`r`n`t`tClearColorbuffer(padView);`r`n")
          } elseif ($v.Contains($anchorLF)) {
            $v = $v.Replace($anchorLF, $anchorLF + "`n`tif (clearBackground)`n`t`tClearColorbuffer(padView);`n")
          } else {
            throw 'DrawBackbufferQuad anchor not found'
          }

          $clearPattern = '(?ms)\r?\n\tif \(clearBackground\)\r?\n\t\{\r?\n\t\tVkClearAttachment clearAttachment\{\};.*?\r?\n\t\}\r?\n\r?\n\tvkCmdBindPipeline'
          if (-not [regex]::IsMatch($v, $clearPattern)) { throw 'vkCmdClearAttachments block not found' }
          $v = [regex]::Replace($v, $clearPattern, "`n`tvkCmdBindPipeline", 1)
          Set-Content -Path $vr -Value $v -NoNewline

      - name: Apply reusable runtime experiment harness
        shell: pwsh
        run: ./tools/diagnostics/Apply-RuntimeExperiments.ps1

      - name: Add runtime-gated pipeline failure diagnostics
        run: python ./tools/diagnostics/Add-PipelineDiagnostics.py

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu once
        run: cmake --build build

      - name: Collect executable and experiment launchers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/experiments | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu_release.exe
          Copy-Item tools/diagnostics/README.md artifact/experiments/README.md

          $launchers = @{
            'A_depthclip_feature.cmd' = 'depthclip-feature,pipeline-diag'
            'B_depthclip_off.cmd' = 'depthclip-off,pipeline-diag'
            'C_pipeline_feedback_off.cmd' = 'pipeline-feedback-off,pipeline-diag'
            'D_both_pnext_off.cmd' = 'depthclip-off,pipeline-feedback-off,pipeline-diag'
            'E_depthclamp_off.cmd' = 'depthclip-off,pipeline-feedback-off,depthclamp-off,pipeline-diag'
            'DIAG_pipeline_only.cmd' = 'pipeline-diag'
            'FULL_pipeline_pnext_off.cmd' = 'pipeline-pnext-off,pipeline-diag'
            'FULL_raster_pnext_off.cmd' = 'raster-pnext-off,pipeline-diag'
            'PERF_1_timer_stats.cmd' = 'timer-stats'
            'PERF_2_udiv64_stats.cmd' = 'timer-udiv64,timer-stats'
            'PERF_3_udiv64_no_fence_stats.cmd' = 'timer-udiv64,timer-no-extra-fence,timer-stats'
            'PERF_4_udiv64_arm64_serialize_stats.cmd' = 'timer-udiv64,timer-arm64-serialize,timer-stats'
          }

          foreach ($entry in $launchers.GetEnumerator()) {
            $body = "@echo off`r`nset CEMU_EXPERIMENTS=$($entry.Value)`r`nstart `"`" `"%~dp0..\Cemu_release.exe`"`r`n"
            Set-Content -Path (Join-Path 'artifact/experiments' $entry.Key) -Value $body -NoNewline -Encoding ascii
          }

      - name: Upload runtime experiment artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-runtime-experiments
          path: ./artifact/

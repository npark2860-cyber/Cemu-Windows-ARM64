name: Adreno missing-draw diagnostic ARM64

on:
  push:
    branches:
      - diag-adreno-pipeline-arm64

concurrency:
  group: diag-adreno-pipeline-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply known-good Adreno compatibility behavior
        shell: pwsh
        run: |
          $swap = 'src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp'
          $s = Get-Content $swap -Raw
          $oldLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_DONT_CARE;'
          $newLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_LOAD;'
          if (-not $s.Contains($oldLoad)) { throw 'Swapchain loadOp pattern not found' }
          $s = $s.Replace($oldLoad, $newLoad)
          Set-Content -Path $swap -Value $s -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw

          $oldFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;'
          $newFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_SIMULTANEOUS_USE_BIT;'
          $flagCount = ([regex]::Matches($v, [regex]::Escape($oldFlag))).Count
          if ($flagCount -ne 2) { throw "Expected 2 ONE_TIME_SUBMIT flags, found $flagCount" }
          $v = $v.Replace($oldFlag, $newFlag)

          $anchorLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`n`tdraw_endRenderPass();`n"
          $anchorCRLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`r`n`tdraw_endRenderPass();`r`n"
          if ($v.Contains($anchorCRLF)) {
            $v = $v.Replace($anchorCRLF, $anchorCRLF + "`r`n`tif (clearBackground)`r`n`t`tClearColorbuffer(padView);`r`n")
          } elseif ($v.Contains($anchorLF)) {
            $v = $v.Replace($anchorLF, $anchorLF + "`n`tif (clearBackground)`n`t`tClearColorbuffer(padView);`n")
          } else {
            throw 'DrawBackbufferQuad anchor not found'
          }

          $clearPattern = '(?ms)\r?\n\tif \(clearBackground\)\r?\n\t\{\r?\n\t\tVkClearAttachment clearAttachment\{\};.*?\r?\n\t\}\r?\n\r?\n\tvkCmdBindPipeline'
          if (-not [regex]::IsMatch($v, $clearPattern)) { throw 'vkCmdClearAttachments block not found' }
          $v = [regex]::Replace($v, $clearPattern, "`n`tvkCmdBindPipeline", 1)
          Set-Content -Path $vr -Value $v -NoNewline

      - name: Instrument failed Vulkan pipelines and skipped draws
        shell: pwsh
        run: |
          $vrh = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.h'
          $h = Get-Content $vrh -Raw
          $hAnchor = "`tbool neverSkipAccurateBarrier{false};"
          if (-not $h.Contains($hAnchor)) { throw 'PipelineInfo diagnostic anchor not found' }
          $hInsert = $hAnchor + "`r`n`r`n`t// Adreno diagnostic: correlate vkCreateGraphicsPipelines failures with skipped draws`r`n`tstd::atomic_bool diagCompileFailed{false};`r`n`tstd::atomic_bool diagFailureDrawLogged{false};"
          $h = $h.Replace($hAnchor, $hInsert)
          Set-Content -Path $vrh -Value $h -NoNewline

          $pch = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanPipelineCompiler.h'
          $ph = Get-Content $pch -Raw
          $phAnchor = "`tbool m_requestRobustBufferAccess{false};"
          if (-not $ph.Contains($phAnchor)) { throw 'PipelineCompiler header diagnostic anchor not found' }
          $ph = $ph.Replace($phAnchor, $phAnchor + "`r`n`tPipelineInfo* m_diagPipelineInfo{};")
          Set-Content -Path $pch -Value $ph -NoNewline

          $pc = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanPipelineCompiler.cpp'
          $p = Get-Content $pc -Raw
          $assignAnchor = "`tm_requestRobustBufferAccess = requireRobustBufferAccess;"
          if (-not $p.Contains($assignAnchor)) { throw 'PipelineCompiler assignment anchor not found' }
          $p = $p.Replace($assignAnchor, $assignAnchor + "`r`n`tm_diagPipelineInfo = pipelineInfo;")

          $oldFail = @"
`telse
`t{
`t`tcemuLog_log(LogType::Force, "Failed to create graphics pipeline. Error {}", (sint32)result);
`t`tcemu_assert_debug(false);
`t`treturn true; // true indicates that caller should no longer attempt to compile this pipeline again
`t}
"@
          if (-not $p.Contains($oldFail)) { throw 'Pipeline failure block not found' }
          $newFail = @"
`telse
`t{
`t`tif (m_diagPipelineInfo)
`t`t{
`t`t`tm_diagPipelineInfo->diagCompileFailed.store(true, std::memory_order_relaxed);
`t`t`tconst uint64 vsHash = m_diagPipelineInfo->vertexShader ? m_diagPipelineInfo->vertexShader->baseHash : 0;
`t`t`tconst uint64 psHash = m_diagPipelineInfo->pixelShader ? m_diagPipelineInfo->pixelShader->baseHash : 0;
`t`t`tconst uint64 gsHash = m_diagPipelineInfo->geometryShader ? m_diagPipelineInfo->geometryShader->baseHash : 0;
`t`t`tcemuLog_log(LogType::Force,
`t`t`t`t"[ADRENO_DIAG] PIPELINE_FAIL state={:016x} min={:016x} result={} vs={:016x} ps={:016x} gs={:016x} prim={} topology={} attrs={} bindings={} cull={} front={} polygon={} depthTest={} depthWrite={} depthCompare={} blendAttachments={} samples={} robust={}",
`t`t`t`tm_diagPipelineInfo->stateHash, m_diagPipelineInfo->minimalStateHash, (sint32)result,
`t`t`t`tvsHash, psHash, gsHash, (uint32)m_diagPipelineInfo->primitiveMode, (uint32)inputAssembly.topology,
`t`t`t`tvertexInputAttributeDescription.size(), vertexInputBindingDescription.size(),
`t`t`t`t(uint32)rasterizer.cullMode, (uint32)rasterizer.frontFace, (uint32)rasterizer.polygonMode,
`t`t`t`t(uint32)depthStencilState.depthTestEnable, (uint32)depthStencilState.depthWriteEnable, (uint32)depthStencilState.depthCompareOp,
`t`t`t`tcolorBlending.attachmentCount, (uint32)multisampling.rasterizationSamples, (uint32)m_requestRobustBufferAccess);
`t`t`tfor (const auto& attr : vertexInputAttributeDescription)
`t`t`t{
`t`t`t`tcemuLog_log(LogType::Force,
`t`t`t`t`t"[ADRENO_DIAG] ATTR state={:016x} loc={} bind={} format={} offset={}",
`t`t`t`t`tm_diagPipelineInfo->stateHash, attr.location, attr.binding, (uint32)attr.format, attr.offset);
`t`t`t}
`t`t`tfor (uint32 i = 0; i < colorBlending.attachmentCount && i < colorBlendAttachments.size(); ++i)
`t`t`t{
`t`t`t`tconst auto& b = colorBlendAttachments[i];
`t`t`t`tcemuLog_log(LogType::Force,
`t`t`t`t`t"[ADRENO_DIAG] BLEND state={:016x} att={} enable={} srcC={} dstC={} opC={} srcA={} dstA={} opA={} mask={}",
`t`t`t`t`tm_diagPipelineInfo->stateHash, i, (uint32)b.blendEnable,
`t`t`t`t`t(uint32)b.srcColorBlendFactor, (uint32)b.dstColorBlendFactor, (uint32)b.colorBlendOp,
`t`t`t`t`t(uint32)b.srcAlphaBlendFactor, (uint32)b.dstAlphaBlendFactor, (uint32)b.alphaBlendOp, (uint32)b.colorWriteMask);
`t`t`t}
`t`t}
`t`telse
`t`t{
`t`t`tcemuLog_log(LogType::Force, "[ADRENO_DIAG] PIPELINE_FAIL state=unknown result={}", (sint32)result);
`t`t}
`t`tcemuLog_log(LogType::Force, "Failed to create graphics pipeline. Error {}", (sint32)result);
`t`tcemu_assert_debug(false);
`t`treturn true; // true indicates that caller should no longer attempt to compile this pipeline again
`t}
"@
          $p = $p.Replace($oldFail, $newFail)
          Set-Content -Path $pc -Value $p -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw
          $nullPattern = 'if \(vkObjPipeline->GetPipeline\(\) == VK_NULL_HANDLE\)\r?\n\t\{'
          $nullCount = ([regex]::Matches($v, $nullPattern)).Count
          if ($nullCount -ne 2) { throw "Expected 2 null-pipeline draw checks, found $nullCount" }
          $diagBlock = @"
if (vkObjPipeline->GetPipeline() == VK_NULL_HANDLE)
`t{
`t`tif (pipeline_info->diagCompileFailed.load(std::memory_order_relaxed) &&
`t`t`t!pipeline_info->diagFailureDrawLogged.exchange(true, std::memory_order_relaxed))
`t`t{
`t`t`tconst uint64 vsHash = pipeline_info->vertexShader ? pipeline_info->vertexShader->baseHash : 0;
`t`t`tconst uint64 psHash = pipeline_info->pixelShader ? pipeline_info->pixelShader->baseHash : 0;
`t`t`tconst uint64 gsHash = pipeline_info->geometryShader ? pipeline_info->geometryShader->baseHash : 0;
`t`t`tcemuLog_log(LogType::Force,
`t`t`t`t"[ADRENO_DIAG] FAILED_PIPELINE_DRAW_SKIPPED state={:016x} min={:016x} vs={:016x} ps={:016x} gs={:016x} prim={}",
`t`t`t`tpipeline_info->stateHash, pipeline_info->minimalStateHash, vsHash, psHash, gsHash, (uint32)pipeline_info->primitiveMode);
`t`t}
"@
          $v = [regex]::Replace($v, $nullPattern, $diagBlock)
          Set-Content -Path $vr -Value $v -NoNewline

          Write-Host 'Diagnostic patch summary:'
          git diff --stat -- $vrh $pch $pc $vr
          git diff -- $vrh $pch $pc $vr

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: cmake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        run: cmake --build build

      - name: Prepare artifact
        run: Rename-Item bin/Cemu_release.exe Cemu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-adreno-pipeline-diag
          path: ./bin/Cemu.exe

name: Adreno missing-draw diagnostic ARM64

on:
  push:
    branches:
      - diag-adreno-pipeline-arm64

concurrency:
  group: diag-adreno-pipeline-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Correct diagnostic script draw-path target
        shell: pwsh
        run: |
          $path = '.github/scripts/diag_adreno_patch.py'
          $s = Get-Content $path -Raw
          $marker = '# Both regular draw paths return early on a null VkPipeline.'
          $idx = $s.IndexOf($marker)
          if ($idx -lt 0) { throw 'Diagnostic tail marker not found' }
          $prefix = $s.Substring(0, $idx)
          $tail = @'
# Persist the compatibility changes made in VulkanRenderer.cpp.
write(vr, v)

# Both regular draw paths live in VulkanRendererCore.cpp, not VulkanRenderer.cpp.
# Log only null handles that came from an actual vkCreateGraphicsPipelines failure.
core = "src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRendererCore.cpp"
c = read(core)
null_head = "if (vkObjPipeline->GetPipeline() == VK_NULL_HANDLE)\n\t{"
if c.count(null_head) != 2:
    raise RuntimeError(f"Expected 2 null-pipeline draw checks in VulkanRendererCore.cpp, found {c.count(null_head)}")

diag_head = '''if (vkObjPipeline->GetPipeline() == VK_NULL_HANDLE)
\t{
\t\tif (pipeline_info->diagCompileFailed.load(std::memory_order_relaxed) &&
\t\t\t!pipeline_info->diagFailureDrawLogged.exchange(true, std::memory_order_relaxed))
\t\t{
\t\t\tconst uint64 vsHash = pipeline_info->vertexShader ? pipeline_info->vertexShader->baseHash : 0;
\t\t\tconst uint64 psHash = pipeline_info->pixelShader ? pipeline_info->pixelShader->baseHash : 0;
\t\t\tconst uint64 gsHash = pipeline_info->geometryShader ? pipeline_info->geometryShader->baseHash : 0;
\t\t\tcemuLog_log(LogType::Force,
\t\t\t\t"[ADRENO_DIAG] FAILED_PIPELINE_DRAW_SKIPPED state={:016x} min={:016x} vs={:016x} ps={:016x} gs={:016x} prim={}",
\t\t\t\tpipeline_info->stateHash, pipeline_info->minimalStateHash, vsHash, psHash, gsHash, (uint32)pipeline_info->primitiveMode);
\t\t}'''
c = c.replace(null_head, diag_head)
write(core, c)

print("Diagnostic patch applied successfully")
'@
          Set-Content -Path $path -Value ($prefix + $tail) -NoNewline

      - name: Apply compatibility fix and diagnostic instrumentation
        shell: bash
        run: python .github/scripts/diag_adreno_patch.py

      - name: Show patch summary
        shell: bash
        run: |
          git diff --stat
          git diff -- src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.h src/Cafe/HW/Latte/Renderer/Vulkan/VulkanPipelineCompiler.h src/Cafe/HW/Latte/Renderer/Vulkan/VulkanPipelineCompiler.cpp src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRendererCore.cpp

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: cmake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        run: cmake --build build

      - name: Prepare artifact
        run: Rename-Item bin/Cemu_release.exe Cemu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-adreno-pipeline-diag
          path: ./bin/Cemu.exe

name: Enhanced Sound TV Persistence ARM64

on:
  push:
    branches:
      - feat/enhanced-sound-experience-v1
    paths:
      - 'tools/fix_enhanced_sound_tv_persistence.py'
      - '.github/workflows/enhanced-sound-tv-persistence-arm64.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enhanced-sound-tv-persistence-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Guard branch
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'feat/enhanced-sound-experience-v1') {
            throw 'TV persistence workflow may run only on feat/enhanced-sound-experience-v1'
          }
          Write-Host "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Apply persistent TV balance patch
        shell: pwsh
        run: python tools/fix_enhanced_sound_tv_persistence.py

      - name: Validate patch and BOTW policy
        shell: pwsh
        run: |
          git diff --check -- src/Cafe/OS/libs/snd_core/ax_voice.cpp
          $ax = Get-Content 'src/Cafe/OS/libs/snd_core/ax_voice.cpp' -Raw
          $routes = Get-Content 'enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini' -Raw
          $ds = Get-Content 'src/Cafe/OS/common/EnhancedSoundDualSenseService.h' -Raw
          if ($ax -notmatch 'bool internalMixWrite\{\}') { throw 'Enhanced mix recursion guard missing' }
          if ($ax -notmatch 'uint16 routeGain\{\}') { throw 'Persistent DRC route gain missing' }
          if ($ax -notmatch 'const bool preserveEnhancedMix') { throw 'Native TV/DRC refresh persistence hook missing' }
          if ($ax -notmatch 'persistedTvMix') { throw 'TV 50 percent persistence path missing' }
          if ($ax -notmatch 'static_cast<uint16>\(vol / 2u\)') { throw 'TV 50 percent attenuation missing' }
          if ($ax -notmatch 'persistedDrcMix') { throw 'DRC persistence path missing' }
          if ($routes -notmatch 'SE_NSword_SwingPlayer\*') { throw 'Player one-hand swing route missing' }
          if ($routes -notmatch 'SE_ESf_SWING_SWORD_S') { throw 'Short one-hand swing route missing' }
          if ($routes -notmatch 'NSword_Charge_Lv1') { throw 'One-hand charge route missing' }
          if ($routes -notmatch 'SE_SW_KAITENGIRI') { throw 'One-hand spin route missing' }
          $dsCode = ($ds -replace '(?m)//.*$', '') -replace '\s+', ''
          if ($dsCode -notmatch 'DualSenseSettings\(0,0,1,0,255,255,0,0\);') { throw 'DualSense internal speaker volume must remain 255' }

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure native ARM64 Cemu
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER_TYPE=MSVC `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        shell: pwsh
        run: cmake --build build --target CemuBin --parallel

      - name: Verify native ARM64 executable
        shell: pwsh
        run: |
          $exe = 'bin/Cemu_release.exe'
          if (-not (Test-Path $exe)) { throw 'Cemu_release.exe not found' }
          $headers = (& dumpbin /headers $exe | Out-String)
          if ($headers -notmatch 'AA64|ARM64') { throw 'Executable is not ARM64' }

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Cafe/OS/libs/snd_core/ax_voice.cpp
          if (-not (git diff --cached --quiet)) {
            git commit -m 'audio: persist enhanced sound TV attenuation'
            git push origin HEAD:feat/enhanced-sound-experience-v1
          }
          "IMPLEMENTATION_HEAD=$(git rev-parse HEAD)" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu-EnhancedSound-TV50-Persistent-ARM64.exe
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/rules.txt artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/rules.txt
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini
          @"
          Enhanced Sound TV Persistence — Windows ARM64
          implementation_head=$Env:IMPLEMENTATION_HEAD
          - DualSense internal speaker volume: 255/255
          - Matched TV output: 50 percent, reapplied after native TV mix refreshes
          - DRC additive routing persists after native DRC mix refreshes
          - BOTW one-hand sword routes include player swing, short swing, charge Lv1 and spin slash cues
          "@ | Set-Content artifact/TV-PERSISTENCE.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-EnhancedSound-TV50-Persistent-ARM64
          path: artifact/**
          if-no-files-found: error

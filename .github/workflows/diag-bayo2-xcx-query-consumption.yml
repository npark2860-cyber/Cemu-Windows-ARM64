name: Cemu ARM64 XCX Predication Consumption Trace

on:
  push:
    branches:
      - diag-xcx-predication-consumption
  workflow_dispatch:

concurrency:
  group: runtime-experiments-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply known-good pre-e834 runtime behavior
        shell: pwsh
        run: |
          $swap = 'src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp'
          $s = Get-Content $swap -Raw
          $oldLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_DONT_CARE;'
          $newLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_LOAD;'
          if (-not $s.Contains($oldLoad)) { throw 'Swapchain loadOp pattern not found' }
          $s = $s.Replace($oldLoad, $newLoad)
          Set-Content -Path $swap -Value $s -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw
          $oldFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;'
          $newFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_SIMULTANEOUS_USE_BIT;'
          $flagCount = ([regex]::Matches($v, [regex]::Escape($oldFlag))).Count
          if ($flagCount -ne 2) { throw "Expected 2 ONE_TIME_SUBMIT flags, found $flagCount" }
          $v = $v.Replace($oldFlag, $newFlag)
          $anchorLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`n`tdraw_endRenderPass();`n"
          $anchorCRLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`r`n`tdraw_endRenderPass();`r`n"
          if ($v.Contains($anchorCRLF)) {
            $v = $v.Replace($anchorCRLF, $anchorCRLF + "`r`n`tif (clearBackground)`r`n`t`tClearColorbuffer(padView);`r`n")
          } elseif ($v.Contains($anchorLF)) {
            $v = $v.Replace($anchorLF, $anchorLF + "`n`tif (clearBackground)`n`t`tClearColorbuffer(padView);`n")
          } else { throw 'DrawBackbufferQuad anchor not found' }
          $clearPattern = '(?ms)\r?\n\tif \(clearBackground\)\r?\n\t\{\r?\n\t\tVkClearAttachment clearAttachment\{\};.*?\r?\n\t\}\r?\n\r?\n\tvkCmdBindPipeline'
          if (-not [regex]::IsMatch($v, $clearPattern)) { throw 'vkCmdClearAttachments block not found' }
          $v = [regex]::Replace($v, $clearPattern, "`n`tvkCmdBindPipeline", 1)
          Set-Content -Path $vr -Value $v -NoNewline

      - name: Apply permanent PS DEFAULT_VAL linkage compatibility fix
        run: python ./tools/compat/Apply-PSDefaultLinkageFix.py

      - name: Apply upstream AArch64 generated-code cache flush fix
        run: python ./tools/compat/Apply-AArch64ReadyRECacheFix.py

      - name: Apply official AMD FidelityFX FSR 1 EASU + RCAS
        run: |
          python ./tools/graphics/Apply-FidelityFXFSRExperiment.py
          python ./tools/graphics/Apply-FidelityFXFSRFullExperiment.py

      - name: Apply reusable runtime experiment harness
        shell: pwsh
        run: ./tools/diagnostics/Apply-RuntimeExperiments.ps1

      - name: Apply VS auxHash pipeline experiments
        run: python ./tools/diagnostics/Apply-VSAuxPipelineExperiment.py

      - name: Apply RT/performance experiments
        run: python ./tools/diagnostics/Apply-RTPerfExperiments.py

      - name: Apply generic ARM64 Diagnostic Edition
        run: python ./tools/diagnostics/Add-PipelineDiagnostics.py

      - name: Validate query-consumption trace script
        run: python -m py_compile ./tools/diagnostics/Apply-Bayo2XCXQueryConsumptionTrace.py

      - name: Apply Bayo2 XCX query-consumption observation trace
        run: python ./tools/diagnostics/Apply-Bayo2XCXQueryConsumptionTrace.py

      - name: Verify query-consumption trace is observation-only
        shell: pwsh
        run: |
          $gx2Path = 'src/Cafe/OS/libs/gx2/GX2_Query.cpp'
          $corePath = 'src/Cafe/HW/Latte/Core/LatteQuery.cpp'
          $gx2 = Get-Content $gx2Path -Raw
          $core = Get-Content $corePath -Raw

          $markers = @(
            '[QUERY_COMPARE] API_BEGIN',
            '[QUERY_COMPARE] API_END',
            '[QUERY_COMPARE] GET_NOT_READY',
            '[QUERY_COMPARE] GET_READY_ZERO',
            '[QUERY_COMPARE] GET_READY_NONZERO',
            '[QUERY_COMPARE] CONDITIONAL_BEGIN',
            '[QUERY_COMPARE] CONDITIONAL_END'
          )
          foreach ($m in $markers) {
            if (-not $gx2.Contains($m)) { throw "Missing GX2 marker: $m" }
          }
          foreach ($m in @('[QUERY_COMPARE] FINISH_ZERO','[QUERY_COMPARE] FINISH_NONZERO')) {
            if (-not $core.Contains($m)) { throw "Missing core marker: $m" }
          }

          foreach ($id in @(
            '0x000500001011B900ULL',
            '0x00050000101C4C00ULL',
            '0x00050000101C4D00ULL',
            '0x0005000010116100ULL'
          )) {
            if (-not $gx2.Contains($id)) { throw "Missing comparison title gate in GX2: $id" }
            if (-not $core.Contains($id)) { throw "Missing comparison title gate in core: $id" }
          }

          foreach ($token in @(
            '*resultOut = endValue - startValue;',
            '*(uint64*)(queryInfo->reg + 2) = 0x100000;'
          )) {
            if (-not $gx2.Contains($token)) { throw "Baseline GX2 behavior missing: $token" }
          }
          foreach ($token in @(
            '*(uint64*)(queryObjectData + 2) = gx2Query->sampleSum;',
            'it->sampleSum += numSamplesPassed;'
          )) {
            if (-not $core.Contains($token)) { throw "Baseline core behavior missing: $token" }
          }

          $diff = git diff --unified=0 -- $gx2Path $corePath | Out-String
          $added = (($diff -split "`r?`n") | Where-Object { $_.StartsWith('+') -and -not $_.StartsWith('+++') }) -join "`n"
          $forbidden = @(
            '(?m)^\+\s*return\s+GX2_',
            '(?m)^\+\s*\*resultOut\s*=',
            '(?m)^\+.*queryInfo->reg.*=',
            '(?m)^\+\s*it->sampleSum\s*\+=',
            '(?m)^\+.*queryObjectData.*='
          )
          foreach ($pattern in $forbidden) {
            if ([regex]::IsMatch($added, $pattern)) { throw "Behavior-changing added line detected: $pattern" }
          }

          git diff --check
          git diff -- $gx2Path $corePath

      - name: Validate XCX predication trace script
        run: python -m py_compile ./tools/diagnostics/Apply-XCXPredicationTrace.py

      - name: Apply XCX IT_SET_PREDICATION observation trace
        run: python ./tools/diagnostics/Apply-XCXPredicationTrace.py

      - name: Verify XCX predication trace is observation-only
        shell: pwsh
        run: |
          $cpPath = 'src/Cafe/HW/Latte/Core/LatteCommandProcessor.cpp'
          $cp = Get-Content $cpPath -Raw

          foreach ($marker in @(
            '[XCX_PREDICATION] ENABLE',
            '[XCX_PREDICATION] DISABLE',
            'source={} phys={:08x} virt={:08x}',
            'LatteCP_itSetPredication(cmdData, nWords, "indirect");',
            'LatteCP_itSetPredication(cmd, nWords, "toplevel");'
          )) {
            if (-not $cp.Contains($marker)) { throw "Missing predication marker/postcondition: $marker" }
          }

          foreach ($id in @(
            '0x00050000101C4C00ULL',
            '0x00050000101C4D00ULL',
            '0x0005000010116100ULL'
          )) {
            if (-not $cp.Contains($id)) { throw "Missing XCX predication title gate: $id" }
          }

          foreach ($token in @(
            'conditionalRenderActive = false;',
            'conditionalRenderActive = true;',
            'uint32 dontWaitFlag = (flags >> 1) & 19;'
          )) {
            if (-not $cp.Contains($token)) { throw "Baseline predication behavior missing: $token" }
          }

          $diff = git diff --unified=0 -- $cpPath | Out-String
          $added = (($diff -split "`r?`n") | Where-Object { $_.StartsWith('+') -and -not $_.StartsWith('+++') }) -join "`n"
          foreach ($pattern in @(
            '(?m)^\+.*conditionalRenderActive\s*=',
            '(?m)^\+.*memory_write',
            '(?m)^\+.*memcpy',
            '(?m)^\+.*memset',
            '(?m)^\+.*\*queryMem\s*='
          )) {
            if ([regex]::IsMatch($added, $pattern)) { throw "Behavior-changing predication line detected: $pattern" }
          }

          git diff --check
          git diff -- $cpPath

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu once
        run: cmake --build build

      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu_release.exe
          @"
          Xenoblade Chronicles X IT_SET_PREDICATION Observation Trace
          Base query-comparison build: a9e731b1761d12eff97916108b11b19100e3b43d
          Target:
            XCX JP 00050000-10116100
            XCX EU 00050000-101C4C00
            XCX US 00050000-101C4D00
          Behavior: observation only; no query values, return codes, predication state, draw behavior, or XCX 0x100000 workaround changed
          Existing marker: [QUERY_COMPARE]
          New marker: [XCX_PREDICATION]
          Captures:
            packet source (toplevel/indirect)
            physical and translated virtual query address
            raw flags/queryType/pixelsMustPass/dontWait bit19
            legacy current dontWait decode for comparison
            raw start/end/result/high-bit state
            whether raw memory still contains the historical 0x100000 seed
          Run XCX and keep the full Cemu log.
          "@ | Set-Content artifact/README_XCX_PREDICATION.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-xcx-predication-consumption-trace
          path: ./artifact/

name: Test index buffer lookup ARM64

on:
  push:
    branches:
      - test-index-buffer-lookup-arm64

concurrency:
  group: test-index-buffer-lookup-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply index buffer lookup diagnostic patch
        shell: pwsh
        run: |
          function Replace-ExactCount([string]$Path, [string]$Old, [string]$New, [int]$ExpectedCount) {
            $content = [IO.File]::ReadAllText($Path)
            $count = ([regex]::Matches($content, [regex]::Escape($Old))).Count
            if ($count -ne $ExpectedCount) { throw "Expected $ExpectedCount occurrence(s) in $Path, found $count" }
            $content = $content.Replace($Old, $New)
            [IO.File]::WriteAllText($Path, $content, [Text.UTF8Encoding]::new($false))
          }

          $mem = 'src/Cafe/HW/Latte/Renderer/Vulkan/VKRMemoryManager.h'
          $oldDecl = "`tvoid FlushReservation(AllocatorReservation* uploadReservation);"
          $newDecl = "`tvoid FlushReservation(AllocatorReservation* uploadReservation);`n`n`t// Diagnostic: resolve VkBuffer from bufferIndex at bind time, like pre-#1443.`n`tVkBuffer GetBufferByIndex(uint32 index)`n`t{`n`t`tVkBuffer buffer = VK_NULL_HANDLE;`n`t`tVkDeviceMemory memory = VK_NULL_HANDLE;`n`t`tm_chunkedHeap.GetChunkVkMemInfo(index, buffer, memory);`n`t`treturn buffer;`n`t}"
          Replace-ExactCount $mem $oldDecl $newDecl 1

          $core = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRendererCore.cpp'
          $oldBind = 'vkCmdBindIndexBuffer(m_state.currentCommandBuffer, indexReservation->vkBuffer, indexBufferOffset, vkType);'
          $newBind = 'vkCmdBindIndexBuffer(m_state.currentCommandBuffer, memoryManager->GetIndexAllocator().GetBufferByIndex(indexBufferIndex), indexBufferOffset, vkType);'
          Replace-ExactCount $core $oldBind $newBind 2

          Write-Host 'Diagnostic patch applied: index VkBuffer is resolved via bufferIndex at bind time.'
          git diff --check

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        run: cmake --build build

      - name: Prepare artifact
        run: Rename-Item bin/Cemu_release.exe Cemu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-index-buffer-lookup-test
          path: ./bin/Cemu.exe

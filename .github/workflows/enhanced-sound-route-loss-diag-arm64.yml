name: Enhanced Sound Route Loss Diagnostic ARM64

on:
  push:
    branches:
      - feat/enhanced-sound-experience-v1
    paths:
      - 'tools/add_enhanced_sound_route_loss_diag.py'
      - '.github/workflows/enhanced-sound-route-loss-diag-arm64.yml'
  workflow_dispatch:

concurrency:
  group: enhanced-sound-route-loss-diag-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Guard branch and record source head
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'feat/enhanced-sound-experience-v1') {
            throw 'Route-loss diagnostic may run only on feat/enhanced-sound-experience-v1'
          }
          $head = git rev-parse HEAD
          Write-Host "SOURCE_HEAD=$head"
          "SOURCE_HEAD=$head" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply route-loss diagnostic instrumentation
        shell: pwsh
        run: python tools/add_enhanced_sound_route_loss_diag.py

      - name: Validate diagnostic structure
        shell: pwsh
        run: |
          git diff --check -- src/Cafe/OS/libs/snd_core/ax_voice.cpp
          if (-not (Test-Path 'src/Cafe/OS/common/EnhancedSoundRouteDiagnostic.h')) { throw 'diagnostic header missing' }
          $ax = Get-Content 'src/Cafe/OS/libs/snd_core/ax_voice.cpp' -Raw
          $diag = Get-Content 'src/Cafe/OS/common/EnhancedSoundRouteDiagnostic.h' -Raw
          if ($ax -notmatch 'voice_start') { throw 'voice_start diagnostic trigger missing' }
          if ($ax -notmatch 'offsets_reuse') { throw 'offsets_reuse diagnostic trigger missing' }
          if ($ax -notmatch 'samples_addr_unrouted') { throw 'samples_addr_unrouted observer missing' }
          if ($ax -notmatch 'std::optional<EnhancedSoundSourceTracker::SourceMatch> source') { throw 'source resolution capture missing' }
          if ($diag -notmatch 'enhanced_sound_route_diag\.csv') { throw 'diagnostic CSV output missing' }
          if ($diag -notmatch 'source_found.*source_path.*track_name.*route_match') { throw 'diagnostic CSV schema incomplete' }

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure native ARM64 Cemu
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER_TYPE=MSVC `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        shell: pwsh
        run: cmake --build build --target CemuBin --parallel

      - name: Verify native ARM64 executable
        shell: pwsh
        run: |
          $exe = 'bin/Cemu_release.exe'
          if (-not (Test-Path $exe)) { throw 'Cemu_release.exe not found' }
          $headers = (& dumpbin /headers $exe | Out-String)
          if ($headers -notmatch 'AA64|ARM64') { throw 'Executable is not ARM64' }

      - name: Prepare diagnostic artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu-EnhancedSound-RouteLossDiag-ARM64.exe
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/rules.txt artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/rules.txt
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini
          @"
          Enhanced Sound Route-Loss Diagnostic — Windows ARM64
          source_head=$Env:SOURCE_HEAD

          This build does not change routing behavior. It only records route decisions.

          Output:
          - enhanced_sound_route_diag.csv is created in the Cemu working directory.
          - Delete any old CSV before each focused test.

          Important trigger values:
          - voice_start: normal voice start route evaluation
          - offsets_reuse: running AX voice reused with a new sample through AXSetVoiceOffsets
          - samples_addr_unrouted: AXSetVoiceSamplesAddr changed a running sample address; current production code does NOT reapply the route here

          CSV decision fields:
          - source_found=0: source/sample correlation failed
          - source_found=1 + empty track_name: source found but track identity failed
          - route_match=0 with source/track present: sound_routes.ini did not match
          - route_match=1: Enhanced Sound route was identified
          - samples_addr_unrouted + route_match=1 is direct evidence that the missing reroute path can swallow controller output

          Reproduction sequence:
          1. Delete enhanced_sound_route_diag.csv.
          2. Launch BOTW with Enhanced Sound Experience enabled and the bundled Graphic Pack.
          3. In a quiet place, fire 10 arrows slowly; note any controller-speaker misses.
          4. Fire 10 arrows rapidly; note miss count/order if possible.
          5. Jump 10 times slowly; note misses.
          6. Jump repeatedly as fast as possible; note misses.
          7. Exit Cemu normally and provide enhanced_sound_route_diag.csv.

          Do not use this build as a performance benchmark; it is diagnostic-only.
          "@ | Set-Content artifact/README-ROUTE-LOSS-DIAG.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-EnhancedSound-RouteLossDiag-ARM64
          path: artifact/**
          if-no-files-found: error

name: Adreno PS default input ARM64

on:
  push:
    branches:
      - fix-adreno-ps-default-input-arm64

concurrency:
  group: fix-adreno-ps-default-input-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply known-good pre-e834 runtime behavior
        shell: pwsh
        run: |
          $swap = 'src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp'
          $s = Get-Content $swap -Raw
          $oldLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_DONT_CARE;'
          $newLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_LOAD;'
          if (-not $s.Contains($oldLoad)) { throw 'Swapchain loadOp pattern not found' }
          $s = $s.Replace($oldLoad, $newLoad)
          Set-Content -Path $swap -Value $s -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw
          $oldFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;'
          $newFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_SIMULTANEOUS_USE_BIT;'
          $flagCount = ([regex]::Matches($v, [regex]::Escape($oldFlag))).Count
          if ($flagCount -ne 2) { throw "Expected 2 ONE_TIME_SUBMIT flags, found $flagCount" }
          $v = $v.Replace($oldFlag, $newFlag)

          $anchorLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`n`tdraw_endRenderPass();`n"
          $anchorCRLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`r`n`tdraw_endRenderPass();`r`n"
          if ($v.Contains($anchorCRLF)) {
            $v = $v.Replace($anchorCRLF, $anchorCRLF + "`r`n`tif (clearBackground)`r`n`t`tClearColorbuffer(padView);`r`n")
          } elseif ($v.Contains($anchorLF)) {
            $v = $v.Replace($anchorLF, $anchorLF + "`n`tif (clearBackground)`n`t`tClearColorbuffer(padView);`n")
          } else {
            throw 'DrawBackbufferQuad anchor not found'
          }

          $clearPattern = '(?ms)\r?\n\tif \(clearBackground\)\r?\n\t\{\r?\n\t\tVkClearAttachment clearAttachment\{\};.*?\r?\n\t\}\r?\n\r?\n\tvkCmdBindPipeline'
          if (-not [regex]::IsMatch($v, $clearPattern)) { throw 'vkCmdClearAttachments block not found' }
          $v = [regex]::Replace($v, $clearPattern, "`n`tvkCmdBindPipeline", 1)
          Set-Content -Path $vr -Value $v -NoNewline
          git diff -- $swap $vr

      - name: Apply PS semantic 0xFE default-value fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Cafe/HW/Latte/LegacyShaderDecompiler/LatteDecompilerEmitGLSLHeader.hpp')
          src = path.read_text(encoding='utf-8')

          old_normal = """\t\t\tif (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)\n\t\t\t\tcontinue;\n\t\t\tsrc->addFmt(\"layout(location = {}) \", i);\n"""
          new_normal = """\t\t\tif (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)\n\t\t\t\tcontinue;\n\t\t\t// Semantic 0xFE has no matching VS export. Latte supplies SPI_PS_INPUT_CNTL.DEFAULT_VAL instead.\n\t\t\tif (psInputTable->import[i].semanticId == 0xFE)\n\t\t\t{\n\t\t\t\tuint32 defaultValue = (shaderContext->contextRegisters[mmSPI_PS_INPUT_CNTL_0 + i] >> 8) & 3;\n\t\t\t\tswitch (defaultValue)\n\t\t\t\t{\n\t\t\t\tcase 0: src->addFmt(\"const vec4 passParameterSem{} = vec4(0.0);\" _CRLF, psInputTable->import[i].semanticId); break;\n\t\t\t\tcase 1: src->addFmt(\"const vec4 passParameterSem{} = vec4(0.0, 0.0, 0.0, 1.0);\" _CRLF, psInputTable->import[i].semanticId); break;\n\t\t\t\tcase 2: src->addFmt(\"const vec4 passParameterSem{} = vec4(1.0, 1.0, 1.0, 0.0);\" _CRLF, psInputTable->import[i].semanticId); break;\n\t\t\t\tcase 3: src->addFmt(\"const vec4 passParameterSem{} = vec4(1.0);\" _CRLF, psInputTable->import[i].semanticId); break;\n\t\t\t\t}\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tsrc->addFmt(\"layout(location = {}) \", i);\n"""
          if src.count(old_normal) != 1:
              raise RuntimeError(f'normal PS import anchor count={src.count(old_normal)}')
          src = src.replace(old_normal, new_normal, 1)

          old_gs = """\t\t\t\t\tif (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tuint32 location = psInputTable->import[i].semanticId & 0x7F; // todo - the range above 128 has special meaning?\n"""
          new_gs = """\t\t\t\t\tif (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tuint32 location = psInputTable->import[i].semanticId & 0x7F; // todo - the range above 128 has special meaning?\n\t\t\t\t\t// Semantic 0xFE uses the fixed default value instead of a GS-to-PS varying.\n\t\t\t\t\tif (psInputTable->import[i].semanticId == 0xFE)\n\t\t\t\t\t{\n\t\t\t\t\t\tuint32 defaultValue = (decompilerContext->contextRegisters[mmSPI_PS_INPUT_CNTL_0 + i] >> 8) & 3;\n\t\t\t\t\t\tswitch (defaultValue)\n\t\t\t\t\t\t{\n\t\t\t\t\t\tcase 0: src->addFmt(\"const vec4 passG2PParameter{} = vec4(0.0);\" _CRLF, location); break;\n\t\t\t\t\t\tcase 1: src->addFmt(\"const vec4 passG2PParameter{} = vec4(0.0, 0.0, 0.0, 1.0);\" _CRLF, location); break;\n\t\t\t\t\t\tcase 2: src->addFmt(\"const vec4 passG2PParameter{} = vec4(1.0, 1.0, 1.0, 0.0);\" _CRLF, location); break;\n\t\t\t\t\t\tcase 3: src->addFmt(\"const vec4 passG2PParameter{} = vec4(1.0);\" _CRLF, location); break;\n\t\t\t\t\t\t}\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\t}\n"""
          if src.count(old_gs) != 1:
              raise RuntimeError(f'GS-to-PS import anchor count={src.count(old_gs)}')
          src = src.replace(old_gs, new_gs, 1)
          path.write_text(src, encoding='utf-8', newline='')

      - name: Show source diff
        shell: pwsh
        run: git diff -- src/Cafe/HW/Latte/LegacyShaderDecompiler/LatteDecompilerEmitGLSLHeader.hpp

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: cmake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        run: cmake --build build

      - name: Prepare artifact
        run: Rename-Item bin/Cemu_release.exe Cemu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-adreno-ps-default-input
          path: ./bin/Cemu.exe

name: Adreno PS default input ARM64

on:
  push:
    branches:
      - fix-adreno-ps-default-input-arm64

concurrency:
  group: fix-adreno-ps-default-input-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply known-good pre-e834 runtime behavior
        shell: pwsh
        run: |
          $swap = 'src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp'
          $s = Get-Content $swap -Raw
          $oldLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_DONT_CARE;'
          $newLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_LOAD;'
          if (-not $s.Contains($oldLoad)) { throw 'Swapchain loadOp pattern not found' }
          $s = $s.Replace($oldLoad, $newLoad)
          Set-Content -Path $swap -Value $s -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw

          $oldFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;'
          $newFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_SIMULTANEOUS_USE_BIT;'
          $flagCount = ([regex]::Matches($v, [regex]::Escape($oldFlag))).Count
          if ($flagCount -ne 2) { throw "Expected 2 ONE_TIME_SUBMIT flags, found $flagCount" }
          $v = $v.Replace($oldFlag, $newFlag)

          $anchorLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`n`tdraw_endRenderPass();`n"
          $anchorCRLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`r`n`tdraw_endRenderPass();`r`n"
          if ($v.Contains($anchorCRLF)) {
            $v = $v.Replace($anchorCRLF, $anchorCRLF + "`r`n`tif (clearBackground)`r`n`t`tClearColorbuffer(padView);`r`n")
          } elseif ($v.Contains($anchorLF)) {
            $v = $v.Replace($anchorLF, $anchorLF + "`n`tif (clearBackground)`n`t`tClearColorbuffer(padView);`n")
          } else {
            throw 'DrawBackbufferQuad anchor not found'
          }

          $clearPattern = '(?ms)\r?\n\tif \(clearBackground\)\r?\n\t\{\r?\n\t\tVkClearAttachment clearAttachment\{\};.*?\r?\n\t\}\r?\n\r?\n\tvkCmdBindPipeline'
          if (-not [regex]::IsMatch($v, $clearPattern)) { throw 'vkCmdClearAttachments block not found' }
          $v = [regex]::Replace($v, $clearPattern, "`n`tvkCmdBindPipeline", 1)
          Set-Content -Path $vr -Value $v -NoNewline

          git diff -- $swap $vr

      - name: Apply PS semantic 0xFE default-value fix
        shell: pwsh
        run: |
          $file = 'src/Cafe/HW/Latte/LegacyShaderDecompiler/LatteDecompilerEmitGLSLHeader.hpp'
          $src = Get-Content $file -Raw

          $oldNormal = @'
			if (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)
				continue;
			src->addFmt("layout(location = {}) ", i);
'@
          $newNormal = @'
			if (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)
				continue;
			// Semantic 0xFE has no matching VS export. Latte supplies SPI_PS_INPUT_CNTL.DEFAULT_VAL instead.
			if (psInputTable->import[i].semanticId == 0xFE)
			{
				uint32 defaultValue = (shaderContext->contextRegisters[mmSPI_PS_INPUT_CNTL_0 + i] >> 8) & 3;
				switch (defaultValue)
				{
				case 0: src->addFmt("const vec4 passParameterSem{} = vec4(0.0);" _CRLF, psInputTable->import[i].semanticId); break;
				case 1: src->addFmt("const vec4 passParameterSem{} = vec4(0.0, 0.0, 0.0, 1.0);" _CRLF, psInputTable->import[i].semanticId); break;
				case 2: src->addFmt("const vec4 passParameterSem{} = vec4(1.0, 1.0, 1.0, 0.0);" _CRLF, psInputTable->import[i].semanticId); break;
				case 3: src->addFmt("const vec4 passParameterSem{} = vec4(1.0);" _CRLF, psInputTable->import[i].semanticId); break;
				}
				continue;
			}
			src->addFmt("layout(location = {}) ", i);
'@
          if (-not $src.Contains($oldNormal)) { throw 'Normal PS import anchor not found' }
          $src = $src.Replace($oldNormal, $newNormal)

          $oldGs = @'
					if (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)
						continue;
					uint32 location = psInputTable->import[i].semanticId & 0x7F; // todo - the range above 128 has special meaning?
'@
          $newGs = @'
					if (psInputTable->import[i].semanticId > LATTE_ANALYZER_IMPORT_INDEX_PARAM_MAX)
						continue;
					uint32 location = psInputTable->import[i].semanticId & 0x7F; // todo - the range above 128 has special meaning?
					// Semantic 0xFE uses the fixed default value instead of a GS-to-PS varying.
					if (psInputTable->import[i].semanticId == 0xFE)
					{
						uint32 defaultValue = (decompilerContext->contextRegisters[mmSPI_PS_INPUT_CNTL_0 + i] >> 8) & 3;
						switch (defaultValue)
						{
						case 0: src->addFmt("const vec4 passG2PParameter{} = vec4(0.0);" _CRLF, location); break;
						case 1: src->addFmt("const vec4 passG2PParameter{} = vec4(0.0, 0.0, 0.0, 1.0);" _CRLF, location); break;
						case 2: src->addFmt("const vec4 passG2PParameter{} = vec4(1.0, 1.0, 1.0, 0.0);" _CRLF, location); break;
						case 3: src->addFmt("const vec4 passG2PParameter{} = vec4(1.0);" _CRLF, location); break;
						}
						continue;
					}
'@
          if (-not $src.Contains($oldGs)) { throw 'GS-to-PS import anchor not found' }
          $src = $src.Replace($oldGs, $newGs)

          Set-Content -Path $file -Value $src -NoNewline
          git diff -- $file

      - name: Setup release mode parameters
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: cmake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        run: cmake --build build

      - name: Prepare artifact
        run: Rename-Item bin/Cemu_release.exe Cemu.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-adreno-ps-default-input
          path: ./bin/Cemu.exe

name: "[Final+SE] Cemu Windows ARM64"

on:
  push:
    branches:
      - build/final-se-arm64
    paths:
      - '.github/workflows/final-se-build.yml'

concurrency:
  group: final-se-arm64-build
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout exact Final+SE source
        uses: actions/checkout@v6
        with:
          ref: 9a0062fa496374597353fb67eba1fbefcde62fde
          submodules: recursive
          fetch-depth: 0

      - name: Assert exact Final+SE source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '9a0062fa496374597353fb67eba1fbefcde62fde') { throw "Unexpected source HEAD: $head" }
          $base = 'd359c53da77dddac6c34554d3b894099896b070e'
          $expected = @(
            '.gitmodules',
            'CMakeLists.txt',
            'dependencies/Gamepad-Core',
            'enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/rules.txt',
            'enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini',
            'src/Cafe/CMakeLists.txt',
            'src/Cafe/GraphicPack/GraphicPack2.cpp',
            'src/Cafe/GraphicPack/GraphicPack2.h',
            'src/Cafe/OS/common/BotWSoundFingerprintCatalog.h',
            'src/Cafe/OS/common/BotWSoundSourceTracer.h',
            'src/Cafe/OS/common/BotWSoundSourceTracerV3Support.h',
            'src/Cafe/OS/common/EnhancedSoundDualSenseService.h',
            'src/Cafe/OS/common/EnhancedSoundPackedBars.h',
            'src/Cafe/OS/common/EnhancedSoundRouter.h',
            'src/Cafe/OS/common/EnhancedSoundSourceTracker.h',
            'src/Cafe/OS/libs/coreinit/coreinit_FS.cpp',
            'src/Cafe/OS/libs/snd_core/ax_voice.cpp',
            'src/config/CemuConfig.cpp',
            'src/config/CemuConfig.h',
            'src/gui/wxgui/GeneralSettings2.cpp',
            'src/gui/wxgui/GeneralSettings2.h'
          ) | Sort-Object
          $actual = @(git diff --name-only "$base..HEAD") | Sort-Object
          if ($actual.Count -ne $expected.Count) { throw "Final+SE diff count mismatch: $($actual.Count)" }
          if ((Compare-Object $expected $actual).Count -ne 0) { Compare-Object $expected $actual; throw 'Final+SE changed-path set mismatch' }
          Write-Host 'PASS: exact 21-path Final+SE source confirmed'

      - name: Apply known-good pre-e834 runtime behavior
        shell: pwsh
        run: |
          $swap = 'src/Cafe/HW/Latte/Renderer/Vulkan/SwapchainInfoVk.cpp'
          $s = Get-Content $swap -Raw
          $oldLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_DONT_CARE;'
          $newLoad = 'colorAttachment.loadOp = VK_ATTACHMENT_LOAD_OP_LOAD;'
          if (-not $s.Contains($oldLoad)) { throw 'Swapchain loadOp pattern not found' }
          $s = $s.Replace($oldLoad, $newLoad)
          Set-Content -Path $swap -Value $s -NoNewline

          $vr = 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanRenderer.cpp'
          $v = Get-Content $vr -Raw
          $oldFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;'
          $newFlag = 'beginInfo.flags = VK_COMMAND_BUFFER_USAGE_SIMULTANEOUS_USE_BIT;'
          $flagCount = ([regex]::Matches($v, [regex]::Escape($oldFlag))).Count
          if ($flagCount -ne 2) { throw "Expected 2 ONE_TIME_SUBMIT flags, found $flagCount" }
          $v = $v.Replace($oldFlag, $newFlag)
          $anchorLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`n`tdraw_endRenderPass();`n"
          $anchorCRLF = "LatteTextureViewVk* texViewVk = (LatteTextureViewVk*)texView;`r`n`tdraw_endRenderPass();`r`n"
          if ($v.Contains($anchorCRLF)) {
            $v = $v.Replace($anchorCRLF, $anchorCRLF + "`r`n`tif (clearBackground)`r`n`t`tClearColorbuffer(padView);`r`n")
          } elseif ($v.Contains($anchorLF)) {
            $v = $v.Replace($anchorLF, $anchorLF + "`n`tif (clearBackground)`n`t`tClearColorbuffer(padView);`n")
          } else {
            throw 'DrawBackbufferQuad anchor not found'
          }
          $clearPattern = '(?ms)\r?\n\tif \(clearBackground\)\r?\n\t\{\r?\n\t\tVkClearAttachment clearAttachment\{\};.*?\r?\n\t\}\r?\n\r?\n\tvkCmdBindPipeline'
          if (-not [regex]::IsMatch($v, $clearPattern)) { throw 'vkCmdClearAttachments block not found' }
          $v = [regex]::Replace($v, $clearPattern, "`n`tvkCmdBindPipeline", 1)
          Set-Content -Path $vr -Value $v -NoNewline

      - name: Apply permanent PS DEFAULT_VAL linkage compatibility fix
        run: python ./tools/compat/Apply-PSDefaultLinkageFix.py

      - name: Apply AMD FidelityFX FSR1
        shell: pwsh
        run: |
          python tools/graphics/Apply-FidelityFXFSRExperiment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/graphics/Apply-FidelityFXFSRFullExperiment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Cemu ARM64 window branding
        shell: pwsh
        run: |
          $main = 'src/gui/wxgui/MainWindow.cpp'
          $m = Get-Content $main -Raw
          $oldMain = 'return BUILD_VERSION_WITH_NAME_STRING;'
          $newMain = 'return wxASCII_STR("Cemu ARM64");'
          if (([regex]::Matches($m, [regex]::Escape($oldMain))).Count -ne 1) { throw 'MainWindow title anchor count mismatch' }
          $m = $m.Replace($oldMain, $newMain)
          Set-Content -Path $main -Value $m -NoNewline
          $ws = 'src/gui/wxgui/wxWindowSystem.cpp'
          $w = Get-Content $ws -Raw
          $oldWindow = 'windowText = BUILD_VERSION_WITH_NAME_STRING;'
          $newWindow = 'windowText = "Cemu ARM64";'
          if (([regex]::Matches($w, [regex]::Escape($oldWindow))).Count -ne 1) { throw 'WindowSystem title anchor count mismatch' }
          $w = $w.Replace($oldWindow, $newWindow)
          Set-Content -Path $ws -Value $w -NoNewline

      - name: Verify source is diagnostics-free
        shell: pwsh
        run: |
          $main = Get-Content 'src/gui/wxgui/MainWindow.cpp' -Raw
          if ($main.Contains('ARM64 Diagnostics') -or $main.Contains('RuntimeDiagnostics')) { throw 'Final+SE UI contains diagnostics code' }
          $pipeline = Get-Content 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanPipelineCompiler.cpp' -Raw
          if ($pipeline.Contains('[ADRENO_DIAG]') -or $pipeline.Contains('RuntimeDiagnostics::')) { throw 'Final+SE pipeline contains diagnostics logging code' }
          $query = Get-Content 'src/Cafe/HW/Latte/Renderer/Vulkan/VulkanQuery.cpp' -Raw
          foreach ($forbidden in @('[GPU_QUERY_VIS]', '[PS_INPUT_LINKAGE]', 'Flag::GpuOcclusionQueryVisibility', 'Flag::PSInputLinkage')) {
            if ($query.Contains($forbidden)) { throw "Final+SE query source contains diagnostic marker: $forbidden" }
          }

      - name: Setup release mode parameters
        shell: pwsh
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        run: choco install ninja -y

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: cmake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER_TYPE=MSVC -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        run: cmake --build build

      - name: Verify native ARM64 and diagnostics-free binary
        shell: pwsh
        run: |
          $exe = 'bin/Cemu_release.exe'
          if (-not (Test-Path $exe)) { throw 'Cemu_release.exe not found' }
          $headers = (& dumpbin /headers $exe | Out-String)
          if ($headers -notmatch 'AA64|ARM64') { throw 'Final+SE executable is not ARM64' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($forbidden in @('ARM64 Diagnostics', '[ADRENO_DIAG]', '[CEMU_DIAG]', '[GPU_QUERY_VIS]', '[PS_INPUT_LINKAGE]')) {
            if ($ascii.Contains($forbidden)) { throw "Final+SE binary contains diagnostic marker: $forbidden" }
          }

      - name: Prepare Final+SE artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu.exe
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/rules.txt artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/rules.txt
          Copy-Item enhanced_sound_policies/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini artifact/graphicPacks/BreathOfTheWild/EnhancedSoundExperience/sound_routes.ini
          'source_head=9a0062fa496374597353fb67eba1fbefcde62fde' | Set-Content artifact/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cemu-arm64-final-se
          path: artifact/**
          if-no-files-found: error

name: BOTW Audio Routing Diagnostic ARM64

on:
  push:
    branches:
      - diag/botw-haptic-state-logger
    paths:
      - 'src/gui/wxgui/AudioDebuggerWindow.*'
      - '.github/workflows/botw-audio-routing-diag-arm64.yml'
  workflow_dispatch:

concurrency:
  group: botw-audio-routing-diag-arm64
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup release mode parameters
        shell: pwsh
        run: |
          echo "BUILD_MODE=release" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_FLAGS=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure clang-cl toolset is installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $modifyArgs = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --quiet --norestart"
          Start-Process -FilePath $setup -Wait -ArgumentList $modifyArgs

      - name: Setup MSVC environment arm64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.0'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

      - name: Setup NuGet Credentials for vcpkg
        shell: bash
        run: |
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
          `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Configure native ARM64 Cemu
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_MODE }} `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER_TYPE=MSVC `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

      - name: Build Cemu
        shell: pwsh
        run: cmake --build build --target CemuBin --parallel

      - name: Verify native ARM64 executable
        shell: pwsh
        run: |
          $exe = 'bin/Cemu_release.exe'
          if (-not (Test-Path $exe)) { throw 'Cemu_release.exe not found' }
          $headers = (& dumpbin /headers $exe | Out-String)
          Write-Host $headers
          if ($headers -notmatch 'AA64|ARM64') { throw 'Diagnostic Cemu executable is not ARM64' }

      - name: Prepare audio-routing diagnostic artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item bin/Cemu_release.exe artifact/Cemu-BOTW-AudioRoutingDiag-ARM64.exe
          @'
          BOTW Audio Routing Diagnostic

          Purpose:
          - Adds a DRC/GamePad mix column to Debug -> View audio debugger.
          - Use it to compare per-voice TV and DRC routing while reproducing BOTW sounds.

          First target:
          - Normal bow draw/release.
          - Public BOTW sound catalogs map generic Bow_Draw* and Bow_Release* cues to M_SceneStatic.bars.

          Test:
          1. Run this executable from your normal Cemu folder.
          2. Launch BOTW.
          3. Open Debug -> View audio debugger.
          4. In a quiet location, draw and release a bow repeatedly.
          5. Watch newly active short voices and record idx/base/end/tvMix/drcMix.
          6. Repeat the same bow action several times to identify a stable sample-base/end signature.

          Do not infer identity from voice index alone; AX voice slots are reusable.
          '@ | Set-Content artifact/README-AUDIO-ROUTING-DIAG.txt

      - name: Upload diagnostic Cemu
        uses: actions/upload-artifact@v6
        with:
          name: Cemu-BOTW-AudioRoutingDiag-ARM64
          path: artifact/*
          if-no-files-found: error
